# Registre des sphères de besoin (spec section 4).
#
# Liste de départ, volontairement large. Extensible : un utilisateur qui ne se reconnaît
# dans aucune sphère existante peut en proposer une nouvelle (falkye/models/profile.py
# -> Sphere avec est_personnalisee=True) sans casser la structure. Les entrées ci-dessous
# sont le noyau "curé" chargé au démarrage (falkye/registry/loader.py) ; les sphères
# proposées par les utilisateurs vivent en base de données, pas dans ce fichier.
#
# `synonymes` (ajouté le 2026-09-03, spec Radar+ point 8, assistance à la configuration
# du profil par IA) : premier jet de mots-clés/expressions en français courant qu'un
# utilisateur pourrait employer pour décrire son usage, servant au Niveau 1 (matching
# local, falkye/assistance_sphere.py) — volontairement un point de départ, pas une liste
# fermée ni exhaustive ; le Niveau 2 (Claude, Radar/Radar+) peut enrichir CE dictionnaire
# en base de données (SphereSynonyme, origine="ia_niveau2") sans jamais modifier ce
# fichier. La sphère elle-même (nom, id) reste inchangée par ce champ.

