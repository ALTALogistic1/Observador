# Registre des canaux de notification.
#
# Même principe que le registre de sources (section 9) : un canal actif ou non existe
# comme entrée structurée ici, avec le même gabarit ; activer/désactiver ou ajouter un
# canal ne touche jamais au moteur de notification (falkye/notifications/base.py),
# seulement une nouvelle entrée + une classe NotificationChannel dans
# falkye/notifications/. Ce registre n'est pas prévu par la spec (qui ne précise pas
# le canal de livraison pour le prototype) — décision produit (2026-08-31, Alexandre) :
# courriel en premier (Phase 1, le plus simple), SMS et WhatsApp en Phase 2 (comptes
# tiers à configurer), ordre de priorité explicite ci-dessous.
#
# Champs du gabarit :
#   id                       identifiant stable
#   nom                      nom affichable
#   statut                    actif | a_developper
#   priorite                  ordre de préférence choisi par Alexandre (1 = premier)
#   fournisseur_technique      ex. smtp, twilio_sms, whatsapp_cloud_api
#   champs_config_requis       noms des variables d'environnement attendues (voir .env.example)
#   formes_livraison           resume | unitaire (liste) — ce que ce canal livre. Obligatoire
#                              sur un canal actif. Charte section 16 : le groupement est la forme
#                              par défaut, l'envoi unitaire est l'exception justifiée.
#   module                     chemin du module (falkye/notifications/<module>.py)
#   notes

channels:
  - id: email
    nom: "Courriel"
    statut: actif
    priorite: 1
    fournisseur_technique: smtp
    champs_config_requis: [SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM_ADDR]
    formes_livraison: [resume]
    module: falkye.notifications.email_channel
    notes: >
      SMTP est INUTILISABLE dans l'environnement de développement comme sur l'hôte de
      production : l'égress est limité au port 443, le port 587 est en délai d'attente et
      aucune liste blanche ne l'ouvre (mesuré le 2026-09-04). Le canal reste ici, correct et
      testé, pour un hôte qui l'autoriserait un jour — l'envoi réel passe par le canal
      `postmark` (API HTTPS). Ne pas activer les deux : le résumé partirait en double.

  - id: sms
    nom: "SMS"
    statut: a_developper
    priorite: 2
    fournisseur_technique: twilio_sms
    champs_config_requis: [TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_SMS_FROM_NUMBER]
    formes_livraison: [resume]
    module: falkye.notifications.sms_channel
    notes: "Nécessite un compte Twilio (ou équivalent) — identifiants/compte à régler par Alexandre quand ce sera le temps."

  - id: whatsapp
    nom: "WhatsApp"
    statut: a_developper
    priorite: 3
    fournisseur_technique: whatsapp_cloud_api
    champs_config_requis: [WHATSAPP_PROVIDER_TOKEN, WHATSAPP_PHONE_ID]
    formes_livraison: [resume]
    module: falkye.notifications.whatsapp_channel
    notes: "Nécessite un compte WhatsApp Business API (ex. Meta Cloud API ou Twilio) — à régler par Alexandre quand ce sera le temps."

  - id: webhook_generique
    nom: "Webhook générique — accès API/webhook complet (Radar+)"
    statut: actif
    priorite: 4
    fournisseur_technique: webhook_http
    # Pas de variable d'environnement globale — l'URL est PROPRE à chaque
    # profil (Profile.webhook_url), voir falkye/notifications/webhook_channel.py.
    champs_config_requis: []
    formes_livraison: [unitaire]
    module: falkye.notifications.webhook_channel
    notes: >
      Construit le 2026-09-02 pour la fonctionnalité Radar+ "accès API/webhook
      complet" (spec section 4bis) — pousse chaque notification (payload JSON
      structuré, voir falkye/notifications/formatter.py) vers l'URL propre à
      chaque profil, réservé au plan RADAR_PLUS
      (WebhookChannel.resoudre_destinataire, jamais un champ codé en dur dans
      le moteur). Aucun profil réel n'a encore d'URL configurée — canal actif
      dans le registre mais sans effet tant qu'un profil Radar+ n'a pas
      `webhook_url` défini (`falkye profile set-webhook`).
