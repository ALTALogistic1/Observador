    # registreentreprises.gouv.qc.ca pour le REQ, voir docs/STATUT_RESEAU.md), et
    # aucune clé API réelle n'existe encore — Alexandre s'est engagé (2026-09-02)
    # à en obtenir une et à configurer un compte Stripe test pour permettre la
    # validation réelle des deux composants avant de les considérer terminés.
    blocage_type: reseau
    methode_acces: agregateur_tiers
    champs_pertinents:
      - nom_employeur
      - titre_poste
      - description_offre
      - ville
      - region
      - date_publication
      - url_offre
    cout: "Payant, variable selon fournisseur — absorbé par l'abonnement Radar (paiement intégré Stripe), pas facturé à l'unité à l'utilisateur"
    region: "Canada/international"
    connecteur: falkye.sources.agregateur_recrutement
    plan_minimum: radar
    regle_calibration: >
      Recherche par mots-clés de transformation/implantation
      (falkye/matching.py:MOTS_CLES_TRANSFORMATION), même liste que le signal
      qualitatif Signal 3 — filtre le volume à la source plutôt que de rapatrier
      l'ensemble du marché d'un fournisseur payant. Une fois ingéré, le signal
      suit exactement le même barème que Guichet-Emplois/EIMT
      (falkye/scoring.py:_score_recrutement_massif) — pas de traitement spécial
      par fournisseur au-delà de la normalisation d'entrée
      (falkye/sources/agregateur_recrutement.py).
    notes: >
      Première source payante construite contre le plan Radar (spec section 9bis,
      décision d'Alexandre du 2026-09-02) : réactive pleinement le signal
      recrutement au-delà de Guichet-Emplois (couverture partielle, offres
      souvent expirées avant consultation — voir
      falkye/sources/guichet_emplois.py) et EIMT positive (ne couvre que le
      recours à des travailleurs étrangers temporaires), au bénéfice notamment du
      persona agences de recrutement. LinkedIn : aucune API publique de
      recherche d'emploi. Indeed : Publisher API fermée depuis 2025/2026 — d'où
      le passage par un agrégateur tiers plutôt qu'un accès direct.

      Fournisseur TRANCHÉ le 2026-09-02 : TheirStack plutôt qu'Apify — API
      structurée et légale, conçue spécifiquement pour ce cas d'usage, contre
      une place de marché de scrapers (Apify) avec risque de conformité aux
      conditions d'utilisation des plateformes sources. `ApifyActeurGeneriqueProvider`
      reste dans falkye/sources/agregateur_recrutement.py (interface
      FournisseurAgregateur déjà générique par fournisseur) mais n'est plus le
      chemin prioritaire.

      Connecteur générique construit (falkye/sources/agregateur_recrutement.py)
      mais NON VALIDÉ contre un vrai appel — theirstack.com est bloqué par le
      proxy réseau de cet environnement de développement, et aucune clé API
      réelle n'existe encore. Statut volontairement laissé à `a_developper`
      (jamais `actif`) jusqu'à ce qu'Alexandre fournisse une clé TheirStack
      réelle et un compte Stripe test, permettant de valider les deux
      composants en conditions réelles avant de les considérer terminés — voir
      docs/STATUT_RESEAU.md.

