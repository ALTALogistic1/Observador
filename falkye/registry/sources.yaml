  - id: agregateur_recrutement_tiers
    nom: "Agrégateur tiers de recrutement — TheirStack (confirmé)"
    signal_associe: [recrutement_massif]
    statut: a_developper
    # Le blocage n'est plus BUDGÉTAIRE (spec section 9bis, décision d'Alexandre du
    # 2026-09-02 : le plan Radar/Stripe finance cette source) — mais un vrai
    # blocage RÉSEAU demeure : theirstack.com est bloqué par le proxy de sortie
