    cle_naturelle: [numero_corporation_federale]  # identifiant stable et unique par corporation, jamais réattribué
    seuils_quarantaine:  # SEUILS_DEFAUT (repli global) — macro-vérification chantier 1 du 2026-09-04 : 694 844 lignes réelles amorcées, idem REQ (un seul rafraîchissement réel disponible) — voir docs/ARCHITECTURE.md, "Quarantaine de diff"
    regle_calibration: >
      Seul un changement d'ADRESSE pour une corporation active DÉJÀ connue
      (détecté par diff entre deux rafraîchissements du miroir local) génère
      un signal — voir falkye/sources/corporations_canada.py:_upsert_row.
      CORRIGÉ le 2026-08-31 (en validant le premier scan réel après le premier
      import complet du REQ) : le code d'origine traitait toute NOUVELLE
      corporation détectée comme un signal, ce qui aurait produit ~695 000
      signaux sur le tout premier import (la quasi-totalité du registre fédéral
      actif) — même erreur de calibration que celle corrigée le même jour pour
      le REQ (une nouvelle incorporation n'est pas une entreprise en
      croissance). Une nouvelle corporation active est toujours mise en miroir
      (utile pour la résolution/vérification future), simplement plus signalée.
    notes: >
      ACTIVÉE en source Phase 1 le 2026-08-31 (demande d'Alexandre). VALIDÉE
      avec de vraies données le 2026-08-31, une fois `d4bf66bykfyaf.cloudfront.net`
      (AWS CloudFront, héberge les CSV réels du jeu de données CKAN) autorisé
      dans l'environnement. Deux corrections apportées après inspection du
      fichier réel : (1) les vraies colonnes diffèrent de l'estimation initiale
      (pas de champ "date d'incorporation" direct — seulement "Date
      d'anniversaire"/"Année du dernier dépôt annuel", aucun fiable, donc non
      extrait plutôt que deviné ; l'adresse est composée à partir de
      Rue/Municipalité/Province/Code postal, pas une seule colonne) ; (2) le
      filtre `name_contains="active"` attrapait aussi les ressources
      "inactive" (la sous-chaîne "active" y est contenue), produisant des
      entrées "Dissoute" — corrigé par une exclusion explicite. Exemple réel
      après correction : "The Huntsman Marine Science Centre", 1 Lower Campus
      Road, St. Andrews, NB. Équivalent fédéral du REQ, mais pancanadien —
      répond au besoin de couverture Canada anglais. Téléchargement gratuit en
      vrac mis à jour QUOTIDIENNEMENT (plus fréquent que le REQ), plus une
      vraie API temps réel (non utilisée ici — le bulk suffit pour un signal de
      type "nouvelle incorporation"). Ne couvre que les entreprises incorporées
      fédéralement — complète le REQ sans le remplacer. Identifiant pivot :
      numéro de corporation fédérale, PAS un NEQ — pas de pivot partagé en
      Phase 1, voir docs/ARCHITECTURE.md, "Généralisation du pivot d'identité".
      Accès aux registres provinciaux hors Québec inégal si activé plus tard
      (gratuit ON/NS pour la recherche de base, payant C.-B., fermé Alberta) —
      à documenter au cas par cas. Note opérationnelle : le premier
      rafraîchissement du miroir local produit un signal pour CHAQUE
      corporation active du fichier (des centaines de milliers) puisque le
      miroir part vide — comportement attendu d'une détection par diff, pas un
      bug ; seuls les rafraîchissements suivants seront réellement incrémentaux.

      MISE EN VEILLEUSE le 2026-09-04 (décision d'Alexandre) : la portée du
      produit devient prioritairement québécoise. Contrairement aux
      subventions/contrats fédéraux et à l'EIMT positive (qui restent actifs
      parce qu'ils font remonter des entreprises québécoises précises), ce
      registre fédéral est un signal registre_corporatif générique, pas
      rattaché à une entreprise québécoise en particulier — n'améliore pas les
      résultats obtenus au Québec au sens de la nouvelle priorité. Plus
      ordonnancée, plus maintenue, aucun correctif prévu. Code, tests et état
      accumulé (EtatLigneSource/EtatSchemaSource, CorporationFederaleEntry —
      694 844 lignes réelles migrées) restent en place pour une reprise sans
      run de référence si la portée s'élargit. Retirée de l'argumentaire
      produit (README.md).

