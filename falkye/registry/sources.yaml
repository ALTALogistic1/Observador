  - id: corporations_canada
    nom: "Corporations Canada (ISED) — registre fédéral"
    signal_associe: [registre_corporatif]
    statut: en_pause  # MISE EN VEILLEUSE — voir note datée ci-dessous
    blocage_type: null
    methode_acces: donnees_ouvertes  # + api (temps réel, plus complet qu'un simple bulk)
    champs_pertinents:
      - numero_corporation_federale
      - nom
      - statut
