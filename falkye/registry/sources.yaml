    cle_naturelle: [nom_entreprise, adresse]  # PAS le numéro de licence : réattribué CHAQUE ANNÉE (folderyear encodé dedans, voir notes) — l'utiliser ferait apparaître 100% de disparitions + 100% d'apparitions à chaque réémission annuelle normale, déclenchant la quarantaine à tort. nom+adresse est l'identifiant stable de l'établissement à travers les réémissions, même clé que licences_municipales_communes.py::LicenceBrute
    seuils_quarantaine:  # SEUILS_DEFAUT (repli global) — macro-vérification chantier 1 du 2026-09-04 : 10 000 lignes brutes réelles (plafond de pagination Opendatasoft, voir notes), idempotent sur deux tirages réels rapprochés (0 écart) — voir docs/ARCHITECTURE.md, "Quarantaine de diff"
    regle_calibration: >
      NON NÉGOCIABLE avant activation (spec section 7, "Principe de calibration"),
      DEUX filtres en cascade, aucun optionnel : (1) pas un simple renouvellement —
      découverte réelle : Vancouver attribue un NOUVEAU numéro de licence CHAQUE
      ANNÉE (folderyear encodé dans le numéro) sur une fenêtre glissante de
      seulement 3 ans, donc la présence/absence dans un instantané ne suffit pas ;
      un miroir persistant (LicenceMunicipaleEntry, voir
      falkye/sources/licences_municipales_communes.py) accumule les
      entreprises+adresses déjà vues, avec la même précaution "premier scan ne
      produit rien" que Corporations Canada/REQ. (2) pas un nouveau démarrage —
      vérification croisée avec Corporations Canada
      (resolve_corp_federale_by_name, même mécanique que resolve_neq_by_name du
      REQ, voir falkye/resolution.py) : ne produit un signal que si le nom
      correspond avec confiance à une corporation fédérale déjà EXISTANTE. Score
      de confiance dédié à ce type de changement (_score_registre_corporatif,
      "nouvel_etablissement" — déjà générique, aucun ajout nécessaire).
    notes: >
      ACTIVÉE en source Phase 2 le 2026-09-01, priorité pancanadienne demandée par
      Alexandre — première source hors Québec pour le signal registre_corporatif
      après Corporations Canada. Portail Opendatasoft (opendata.vancouver.ca, PAS
      du CKAN comme la plupart des autres sources) — API v2.1 JSON, aucune
      authentification. Jeu de données "business-licences", 205 329 lignes réelles
      (167 962 au statut "Issued", les seules retenues). Validé de bout en bout :
      le mécanisme "premier scan ne produit rien" confirmé (0 signal sur un premier
      scan de 2 625 licences réelles) ; le diff "nouvel établissement" confirmé
      isolément (entreprises retirées puis réintroduites correctement redétectées
      comme nouvelles, entreprise déjà connue correctement exclue) ; la
      vérification croisée Corporations Canada confirmée dans les deux sens sur un
      échantillon réel de 59 grands employeurs vancouvérois (6 correspondances
      confiantes — ex. "Acme Import & Export Ltd", "KPMG Inc", "Parking
      Corporation of Vancouver" — la plupart des entreprises testées, y compris
      de grandes marques comme Lululemon ou Telus, sont incorporées
      PROVINCIALEMENT en C.-B. et ne matchent donc pas Corporations Canada, limite
      connue et attendue) ; scan complet de bout en bout (fenêtre 700 jours) :
      294 signaux réels, dont des compagnies à numéro fédérales évidentes (le nom
      contient littéralement son propre numéro de corporation, ex. "14690605
      CANADA INC.", correspondance à 100.0) et des entreprises nommées réelles
      ("NOVAGEN AI CORP.", "MEWAR INFOTECH LIMITED", "Mira Geoscience Limited").
      LIMITE DE PAGINATION RÉELLE de la plateforme Opendatasoft : offset+limit
      <= 10 000 par requête (confirmé) — sans effet sur un scan à fenêtre courte
      (30-90 jours, défaut du moteur, ~2 900 lignes/90 jours observées), mais
      borne un appel `--historique-complet` (log d'avertissement explicite
      plutôt qu'échec silencieux).

      MISE EN VEILLEUSE le 2026-09-04 (décision d'Alexandre) : la portée du
      produit devient prioritairement québécoise — une source pancanadienne
      n'est retenue que si elle améliore les résultats obtenus au Québec, ce
      qui n'est pas le cas d'une source municipale hors Québec. Plus
      ordonnancée (statut retiré de "actif", donc exclue de
      sources_actives()/sources_actives_automatisees()), plus maintenue,
      aucun correctif prévu — y compris le plafond de pagination Opendatasoft
      documenté ci-dessus, qui reste tel quel. Rien n'est supprimé : code,
      tests et état accumulé (EtatLigneSource/EtatSchemaSource,
      LicenceMunicipaleEntry) restent en place, pour une reprise SANS run de
      référence si la portée s'élargit à nouveau. Retirée de l'argumentaire
      produit (README.md) — voir docs/STATUT_RESEAU.md pour le suivi complet.

  - id: licences_toronto
    nom: "Licences d'affaires — Ville de Toronto"
    signal_associe: [registre_corporatif]
    statut: en_pause  # MISE EN VEILLEUSE — voir note datée ci-dessous
    blocage_type: null
    methode_acces: api  # API Datastore CKAN — voir notes
    champs_pertinents:
      - nom_entreprise
      - adresse
      - type_entreprise
      - date_emission
    cout: gratuit
    region: "Toronto"
    province_code: "on"  # détection d'expansion inter-provinciale, spec Radar+ point 7 (voir falkye/expansion_interprovinciale.py) — quoté : "on" nu serait lu comme booléen par PyYAML (YAML 1.1)
    connecteur: falkye.sources.licences_toronto
    type_ingestion: instantane  # Chantier 1 (audit 2026-09-03, faille E) — voir falkye/diff_engine.py
    cle_naturelle: [identifiant_licence]  # "Licence No." — confirmé PERSISTANT (contrairement à Vancouver, pas réattribué chaque année) ; une même entreprise peut obtenir plusieurs numéros successifs au fil des décennies, chacun un nouvel identifiant DE PLEIN DROIT pour ce moteur générique (le filtrage "pas un simple renouvellement" reste la responsabilité du miroir LicenceMunicipaleEntry bespoke, pas de ce moteur)
    seuils_quarantaine:  # SEUILS_DEFAUT (repli global) — macro-vérification chantier 1 du 2026-09-04 : 37 501 lignes brutes réelles (licences actives, Cancel Date vide), 3 clés dupliquées trouvées et corrigées (voir docs/ARCHITECTURE.md, "bogue réel trouvé"), idempotent sur deux tirages réels rapprochés (0 écart)
    regle_calibration: >
      Même règle "NON NÉGOCIABLE" que licences_vancouver (voir sa
      regle_calibration pour le détail complet) : (1) pas un simple
      renouvellement — le miroir commun LicenceMunicipaleEntry est réutilisé sans
      modification, avec la même précaution "premier scan ne produit rien" ;
      (2) pas un nouveau démarrage — même vérification croisée Corporations
      Canada (resolve_corp_federale_by_name). Nuance propre à Toronto :
      contrairement à Vancouver, le numéro de licence est un identifiant
      PERSISTANT (pas réattribué chaque année), mais une même entreprise obtient
      quand même parfois plusieurs numéros successifs au fil des décennies
      (confirmé sur un exemple réel : 4 licences distinctes entre 2002 et 2019)
      — le miroir reste donc nécessaire, pas seulement pour Vancouver.
    notes: >
      ACTIVÉE en source Phase 2 le 2026-09-01, 2e ville hors Québec pour le
      registre corporatif après Vancouver, une fois le 2e domaine
      (ckan0.cf.opendata.inter.prod-toronto.ca) autorisé par Alexandre —
      confirmé être le vrai backend CKAN (open.toronto.ca n'est que la façade
      web, son /api/3/action/* retourne 404). Jeu de données "Municipal
      Licensing and Standards - Business Licences and Permits", ressource
      datastore-active 169e90ba-3ae0-43dd-8b2f-919e87002f50 : 159 647 lignes
      réelles, historique complet depuis 1946 (contrairement à Vancouver qui ne
      couvre qu'une fenêtre glissante de 3 ans). Champ `Client Name` (nom légal)
      utilisé comme nom_entreprise plutôt que `Operating Name` (nom commercial),
      plus fiable pour la vérification croisée Corporations Canada. Licences
      annulées (`Cancel Date` non vide) exclues. Quirk de qualité de données
      réel : un champ texte vide est parfois encodé par la chaîne littérale
      "None" plutôt qu'un JSON null (voir _nettoyer dans le connecteur) —
      touche aussi de vraies lignes "junk" du jeu de données (catégorie
      "** Class record not on file"). Validation de bout en bout : premier scan
      (1 452 licences réelles, fenêtre 90 jours) → 0 signal, confirmant le
      mécanisme "premier scan" ; deuxième scan simulé → signaux réels produits,
      dont des compagnies à numéro fédérales évidentes (ex. "18093504 CANADA
      INC", "9003088 CANADA CORP" — correspondance 100.0 avec Corporations
      Canada, cette dernière avec plusieurs adresses réellement distinctes
      confirmées, chacune un nouvel établissement légitime).

      MISE EN VEILLEUSE le 2026-09-04 (décision d'Alexandre) : même raison et
      mêmes conditions que licences_vancouver — voir sa note. Plus
      ordonnancée, plus maintenue, aucun correctif prévu. Code, tests et état
      accumulé (EtatLigneSource/EtatSchemaSource, LicenceMunicipaleEntry)
      restent en place. Retirée de l'argumentaire produit (README.md).

