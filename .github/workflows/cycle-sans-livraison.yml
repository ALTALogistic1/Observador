name: Lancer un cycle sans livraison

# Pourquoi ce flux existe : l'hôte ne peut être administré QUE d'ici — le port 22
# est bloqué depuis l'environnement de développement. Le coureur, lui, l'atteint.
#
# Ce qu'il déclenche : `falkye cycle --sans-livraison`. Un cycle RÉEL —
# réconciliation des livraisons du cycle précédent, puis détection sur les neuf
# sources avec le miroir REQ en place. Il écrit des entreprises, des signaux, de
# l'état de diff et du journal. Il n'envoie AUCUN courriel : la coupure est dans
# le code, avant la génération des résumés, et trois tests la verrouillent
# (tests/test_cycle.py).
#
# Ce qu'il NE fait pas : démarrer `falkye-cycle.service`, qui livre. Cette unité
# n'est pas dans le fichier de sudoers, et ne doit pas y entrer — seul son
# minuteur la déclenche.
#
# Pourquoi À LA DEMANDE : c'est une mesure et une observation, pas un
# ordonnancement. Le cycle régulier, lui, a son minuteur.
#
# Ce flux LANCE et rend la main — il ne supervise pas. L'état se lit avec le flux
# « État du cycle sans livraison », qui ne demande aucun privilège.
on:
  workflow_dispatch:

concurrency:
  # Deux cycles simultanés écriraient le même état de diff, et le second verrait
  # le travail du premier comme déjà fait. Le second attend; il n'annule pas le
  # premier, dont l'écriture serait alors laissée à moitié.
  group: cycle-production
  cancel-in-progress: false

jobs:
  lancer:
    runs-on: ubuntu-latest
    # Quelques minutes suffisent : ce flux LANCE, il ne supervise pas. Voir la
    # note sur les six heures ci-dessous.
    timeout-minutes: 10
    steps:
      - name: Préparer l'accès SSH
        env:
          CLE: ${{ secrets.FALKYE_DEPLOY_SSH_KEY }}
          HOTES_CONNUS: ${{ secrets.FALKYE_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # L'empreinte du serveur vient d'un secret, jamais d'un ssh-keyscan :
          # la récupérer depuis le réseau qu'on cherche à ne pas croire ne
          # vérifie rien. Même règle que la chaîne de déploiement.
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Lancer le cycle, sans attendre sa fin
        env:
          HOTE: ${{ secrets.FALKYE_DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.FALKYE_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # **Pourquoi le lancement est DÉTACHÉ.** Un travail sur coureur hébergé
          # par GitHub est plafonné à SIX HEURES, quoi qu'on mette dans
          # `timeout-minutes`. Un run de référence dure plus que ça : le flux
          # serait tué pendant que l'unité continue sur l'hôte, et on lirait un
          # flux en échec à côté d'un cycle vivant — deux signaux contradictoires
          # pour un seul fait.
          #
          # L'hôte POSSÈDE l'exécution, le coureur ne fait que la déclencher.
          # C'est `TimeoutStartSec` de l'unité qui la borne, pas le coureur.
          #
          # La commande `sudo` est identique AU CARACTÈRE PRÈS à celle du fichier
          # de sudoers : une entrée portant des arguments n'autorise que ces
          # arguments exacts, donc ajouter un `--no-block` la ferait refuser. Le
          # détachement est fait par le shell autour, jamais dans la commande.
          ssh -i ~/.ssh/id_deploiement -o IdentitiesOnly=yes "$UTILISATEUR@$HOTE" \
            'nohup sudo /usr/bin/systemctl start falkye-cycle-sans-livraison.service \
                >/dev/null 2>&1 &'

      - name: Vérifier que le cycle a bien démarré
        env:
          HOTE: ${{ secrets.FALKYE_DEPLOY_HOST }}
          UTILISATEUR: ${{ secrets.FALKYE_DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Lancer sans vérifier serait un filet qui capture sans livrer : un
          # `sudo` refusé, une unité absente, une faute de frappe dans son nom —
          # tout ça disparaîtrait dans le `>/dev/null` du détachement, et le flux
          # se déclarerait vert sans que rien n'ait démarré. On CONSTATE donc
          # l'état avant de rendre la main.
          for essai in $(seq 1 15); do
            ETAT=$(ssh -i ~/.ssh/id_deploiement -o IdentitiesOnly=yes \
              "$UTILISATEUR@$HOTE" \
              'systemctl is-active falkye-cycle-sans-livraison.service' || true)
            echo "tentative $essai : $ETAT"
            case "$ETAT" in
              activating|active) echo "::notice::cycle démarré — état $ETAT"; exit 0 ;;
            esac
            sleep 2
          done
          echo "::error::le cycle n'a pas démarré (dernier état : ${ETAT:-inconnu})"
          exit 1

      - name: Où lire la suite
        run: |
          echo "Le cycle tourne sur l'hôte, hors de ce flux."
          echo "Déclencher « État du cycle sans livraison » pour son avancement,"
          echo "sa durée et son pic mémoire."
