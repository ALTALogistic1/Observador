      (jamais codé en dur, même discipline que Deloitte Fast 50 — voir
      observador/sources/rob_top_growing.py:trouver_url_article_courant).
      L'article lui-même est une page JS (CMS Fusion/Arc XP) dont le corps visible
      est vide en HTML brut, mais le CMS embarque tout l'article dans un bloc
      `Fusion.globalContent`, y compris l'indicateur officiel de paywall
      (`content_restrictions.content_code`, confirmé "green" = accès libre pour ce
      classement — PAS payant malgré la réputation générale du site, à
      re-vérifier si jamais un autre code est rencontré) et un identifiant Google
      Sheet menant à un fichier JSON public sur S3 (aucune authentification, aucun
      anti-bot rencontré — contrairement à Growth 500/canadianbusiness.com,
      bloqué par Cloudflare, voir la source `growth500` et docs/STATUT_RESEAU.md).
      Champ région irrégulier dans les données sources (grandes villes données
      seules, ex. "Montreal", sans province) — voir
      observador/sources/rob_top_growing.py:_parse_ville_region ; laissé à None
      plutôt que deviné, résolu via le REQ comme les autres champs absents (spec
      section 7, "principe de complétude").

