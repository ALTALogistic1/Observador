# Registre des sources (spec section 9, "Architecture des sources — modularité obligatoire").
#
# Chaque source, active ou non, existe comme une entrée structurée ici, avec le même
# gabarit. Le moteur (observador/engine.py) boucle sur les sources dont
# statut == "actif" et charge leur connecteur via observador/sources/registry_loader.py.
# Activer/désactiver une source = changer `statut` ici, jamais toucher au moteur.
# Ajouter une source = ajouter une entrée + un connecteur dans observador/sources/,
# jamais modifier le reste du système.
#
# Champs du gabarit (section 9) :
#   id                   identifiant stable
#   nom                  nom affichable
#   signal_associe       liste d'ids de types de signaux (voir signal_types.yaml)
#   statut                actif | inactif | a_developper | en_pause
#   blocage_type          null | legal | budgetaire
#                         (extension additive, non prévue par le gabarit initial : distingue,
#                         pour une source non "actif", si le blocage est structurel — légal,
#                         section 8 — ou une décision budgétaire qui revient à Alexandre, par
#                         opposition à une source simplement pas encore développée)
#   methode_acces         api | donnees_ouvertes | scraping | agregateur_tiers | payant_unitaire
#                         | import_manuel (spec section 9, "Import manuel de documents
#                         sources" — activer une source payante à l'unité sans engagement
#                         récurrent ; voir observador/manual_import.py, générique pour
#                         n'importe quelle source dans cette situation, pas que le RDPRM)
#   champs_pertinents     liste des champs à extraire et conserver (section 7)
#   cout                  gratuit | payant + détail
#   region                region couverte
#   connecteur            chemin du module connecteur (observador/sources/<module>.py) ;
#                         null pour une source sans connecteur codé pour l'instant, ou pour
#                         une source en import_manuel (pas de boucle de découverte automatisée)
#   regle_calibration      la règle concrète et vérifiable qui distingue un vrai signal
#                         de croissance du bruit pour CETTE source (Principes directeurs
#                         #3, non négociable) ; null tant qu'elle n'est pas définie — une
#                         source ne peut avoir statut=actif sans elle (voir
#                         Registry.valider_calibration, appelé avant tout scan réel)
#   lien_recherche         obligatoire quand methode_acces == import_manuel : lien direct
#                         vers la page de RECHERCHE de la source (pas sa page d'accueil),
#                         présenté à l'utilisateur au moment de l'import (voir CLI)
#   notes                 contexte libre (limites connues, contacts, découvertes)

sources:
  # ---------------------------------------------------------------------
  # Phase 1 — actives
  # ---------------------------------------------------------------------
  - id: seao
    nom: "SEAO (Système électronique d'appel d'offres du Québec)"
    signal_associe: [appel_offres]
    statut: actif
    blocage_type: null
    methode_acces: donnees_ouvertes
    champs_pertinents:
      - entreprise_adjudicataire
      - adresse_entreprise_adjudicataire   # résolue via REQ si non fournie directement
      - valeur_contrat
      - secteur_nature_contrat
      - date_attribution
      - donneur_ordre
    cout: gratuit
    region: "Québec"
    connecteur: observador.sources.seao
    regle_calibration: >
      Aucun filtrage de bruit nécessaire : chaque enregistrement "award" du fichier
      SEAO est déjà un contrat effectivement attribué (pas une simple soumission ou
      un avis administratif) — voir observador/sources/seao.py:_extraire_awards.
      Le score de confiance distingue ensuite les contrats significatifs des petits
      contrats par paliers de valeur (observador/scoring.py:_score_appel_offres).
    notes: >
      Données ouvertes via le portail CKAN de Données Québec (donneesquebec.ca), formats
      JSON (depuis mars 2021, inspiré de l'Open Contracting Data Standard) et XML (depuis
      2009). Mise à jour hebdomadaire/mensuelle. Aucune clé d'API requise. 372 fichiers
      hebdomadaires/mensuels archivés depuis 2021 (confirmé le 2026-08-31) — voir
      observador.engine.run_recherche_ponctuelle pour le plafond par défaut (60 jours) qui
      évite de tous les retélécharger/traiter à chaque `scan ponctuel`.

  - id: rdprm
    nom: "RDPRM (Registre des droits personnels et réels mobiliers)"
    signal_associe: [financement_expansion]
    statut: actif
    blocage_type: null
    methode_acces: import_manuel
    lien_recherche: "https://www.rdprm.gouv.qc.ca/Consultation/"
    champs_pertinents:
      - nom_entreprise_debitrice
      - adresse_entreprise_debitrice        # résolue via REQ à défaut
      - nature_bien
      - valeur_garantie
      - date_inscription
      - institution_creancière
    cout: "Payant à l'unité — tarif réglementé : 11 $ par recherche par nom d'entreprise, 4 $ par NIV. Pas d'abonnement en vrac ni d'API publique."
    region: "Québec"
    connecteur: null  # pas de boucle de découverte automatisée — voir observador/manual_import.py
    regle_calibration: >
      Appliquée par Alexandre au moment de CHOISIR de faire l'import (pas
      vérifiable par le code sur un document arbitraire) : ne retenir qu'une
      garantie sur bien d'entreprise à valeur significative, en excluant les
      garanties sur biens personnels et les garanties qui ressemblent à un
      refinancement ou un achat de routine (véhicule isolé) plutôt qu'à une
      réelle expansion (équipement/inventaire de production) — spec section
      6/7. Une fois importée, la valeur et la nature du bien passent par le même
      barème de score que documenté (observador/scoring.py:_score_financement_expansion).
    notes: >
      ACTIVÉE le 2026-08-31 via le mécanisme générique d'import manuel (spec
      section 9, "Import manuel de documents sources") plutôt qu'une automatisation
      complète — aucun abonnement ni engagement récurrent : Alexandre paie
      seulement les recherches RDPRM qu'il choisit de faire, au moment où il les
      fait (11 $/nom), et les importe via `observador import-manuel --source-id
      rdprm` (voir observador/manual_import.py et observador/cli.py). Le résultat
      importé suit ensuite exactement le même pipeline qu'un signal automatisé
      (résolution NEQ, vérifications de base, score, corroboration,
      notification). DÉCOUVERTE antérieure (contredit l'hypothèse du README) :
      aucun accès gratuit en vrac ni API publique — seulement cette consultation
      payante à l'unité, une recherche à la fois, carte de crédit (voir
      rdprm.gouv.qc.ca) — d'où le choix de l'import manuel plutôt que
      l'automatisation.

  - id: req
    nom: "Registre des entreprises du Québec (REQ)"
    signal_associe: [registre_corporatif]
    statut: actif
    blocage_type: null
    methode_acces: import_manuel
    lien_recherche: "https://www.registreentreprises.gouv.qc.ca/RQAnonymeGR/GR/GR03/GR03A2_22A_PIU_RecupDonnPub_PC/FichierDonneesOuvertes.aspx"
    champs_pertinents:
      - neq
      - nom_entreprise
      - secteur_activite   # CAE/CTI
      - adresses
      - statut             # immatriculee | radiee
      - date_derniere_maj
    cout: gratuit
    region: "Québec"
    connecteur: observador.sources.req  # conservé pour detect_from_file — pas appelé par la boucle automatisée (methode_acces=import_manuel)
    regle_calibration: >
      Seuls deux types de changement génèrent un signal : nouvel établissement
      SECONDAIRE d'une entreprise déjà connue (fort), ou changement d'adresse du
      siège social (moyen) — toute autre mise à jour (déclaration annuelle,
      correction mineure, renouvellement, ET une NOUVELLE immatriculation elle-même)
      est explicitement exclue. Implémenté dans
      observador/sources/req.py:_ingest_zip_req_reel/_diff_etablissements_secondaires
      (le tout premier établissement d'une toute nouvelle entreprise ne déclenche
      jamais le signal fort — sinon toute nouvelle immatriculation serait à tort
      traitée comme une expansion). Voir _stats_vers_signaux pour la conversion en
      RawSignal.
    notes: >
      BASCULÉE en import manuel le 2026-08-31 (décision d'Alexandre, suite à une
      analyse détaillée du blocage réseau — voir docs/STATUT_RESEAU.md). Le
      téléchargement automatisé du fichier en vrac échoue systématiquement (HTTP 403,
      "utilisation excessive", Cloudflare) depuis cette session — preuve détaillée
      (IP de sortie différente à chaque tentative, échec dès le tout premier essai)
      pointant vers une règle Cloudflare visant les plages IP infonuagiques
      partagées, PAS un problème avec cette méthode d'accès en tant que telle ni un
      excès de requêtes de notre part (une seule requête par exécution, jamais par
      entreprise — confirmé par audit du code). Solution retenue : le même mécanisme
      générique d'import manuel déjà construit pour le RDPRM
      (observador/manual_import.py), étendu pour couvrir le cas "fichier complet"
      (SourceConnector.detect_from_file, pas seulement "un document = une
      entreprise") — voir docs/ARCHITECTURE.md. Alexandre télécharge lui-même le
      fichier via lien_recherche (le même lien découvert dynamiquement par le code,
      pas une URL différente), puis l'importe via `observador import-manuel fichier
      --source-id req --chemin <fichier>`. Tâche récurrente légère : le fichier n'est
      mis à jour que deux fois par mois. Données ouvertes via CKAN
      (donneesquebec.ca) à l'origine, double usage inchangé : (1) base de résolution
      NEQ/adresse/secteur pour toutes les autres sources — voir
      observador/resolution.py — et vérification obligatoire du statut légal
      (observador/verification.py) ; (2) source de signal en soi. Les
      actionnaires/administrateurs sont anonymisés dans les données ouvertes. Le
      chemin réseau automatisé (REQConnector.detect) reste codé et fonctionnel, gardé
      au cas où l'accès redeviendrait praticable, mais n'est plus appelé par la
      boucle automatisée du moteur tant que methode_acces=import_manuel.
      SCHÉMA RÉEL CONFIRMÉ le 2026-08-31 (fichier réel inspecté, SHA-256 vérifié) :
      le fichier en vrac est un .zip de 6 CSV liés par NEQ, pas un fichier plat
      (Entreprise.csv, Nom.csv, Etablissements.csv utilisés ; DomaineValeur.csv pour
      confirmer les codes ; FusionScissions.csv/ContinuationsTransformations.csv hors
      périmètre). Jointure écrite et validée contre de vraies données (nom/statut/
      adresse résolus correctement) — voir docs/STATUT_RESEAU.md pour le détail,
      dont une limite réelle de complétude d'adresse (dossiers anciens souvent sans
      établissement déclaré).

  # ---------------------------------------------------------------------
  # Phase 2 — gratuites, à développer (section 8 : toute source gratuite de
  # bonne qualité fait partie du prototype, séquencée après la Phase 1)
  # ---------------------------------------------------------------------
  - id: guichet_emplois
    nom: "Guichet-Emplois (Job Bank Canada)"
    signal_associe: [recrutement_massif]
    statut: actif
    blocage_type: null
    methode_acces: donnees_ouvertes
    champs_pertinents:
      - nom_employeur    # récupéré via la page de détail d'offre individuelle — voir notes
      - secteur_activite # sous-produit de la même page (bonus, pas garanti)
      - titre_poste      # texte intégral, pour l'analyse qualitative des mots-clés
      - profession_cnp
      - nombre_postes
      - remuneration
      - ville_region
      - date_publication
    cout: gratuit
    region: "Canada (filtre Québec par défaut)"
    connecteur: observador.sources.guichet_emplois
    regle_calibration: >
      Deux mécanismes de calibration déjà en place (spec section 7, Signal 3) : (1) le
      signal qualitatif ne retient un poste que si son titre contient un mot-clé de
      transformation/implantation, générique ou propre au profil — voir
      observador/matching.py:correspondance_qualitative_titre ; (2) le signal
      volumétrique se calibre par paliers de nombre de postes simultanés — voir
      observador/scoring.py:_score_recrutement_massif. S'y ajoute désormais une
      calibration de couverture propre à cette source : une offre expirée (HTTP non-200,
      ou 200 sans bloc employeur) ne produit AUCUN signal plutôt qu'un signal avec un
      nom d'employeur deviné ou vide — voir _extraire_employeur/recuperer_employeur.
    notes: >
      RÉACTIVÉE le 2026-09-01 (décision d'Alexandre), après avoir été retirée le
      2026-08-31 : le fichier en vrac (65 colonnes réelles, UTF-16, tabulé) ne contient
      AUCUN nom d'employeur ni URL/permalien vers l'offre — confirmé par inspection du
      CSV et par la description officielle du jeu de données sur open.canada.ca.
      Nouvelle piste validée avec de vraies données : les pages de détail d'offre
      individuelle sur guichetemplois.gc.ca AFFICHENT le nom de l'employeur (et souvent
      le secteur d'activité), même si le fichier en vrac ne le donne pas. `ID WIC Lieu
      emploi` (vraie colonne du fichier) correspond exactement à l'identifiant utilisé
      dans `https://www.guichetemplois.gc.ca/jobsearch/jobposting/{id}` ; sur une offre
      active, le nom est dans un `<h2>` sous `class="job-posting-details-employer-wrapper"`.
      LIMITE RÉELLE CONFIRMÉE (pas un bogue) : le fichier en vrac a un décalage de
      publication d'environ un mois, et les offres individuelles expirent plus vite que
      ce décalage — deux échantillons réels du fichier de juillet 2026 (5/5 puis 4/4
      identifiants) retournent HTTP 410 Gone (redirection vers jobpostingexpired).
      Validation de bout en bout : 15 offres Québec tentées, 0 signal — cohérent avec
      cette contrainte, pas un connecteur cassé. Décision d'Alexandre : garder
      l'architecture fichier-en-vrac (cohérente avec toutes les autres sources) et
      accepter une couverture PARTIELLE plutôt qu'un scraping des résultats de recherche
      en direct (risque de blocage anti-bot comme les moteurs de recherche testés pour
      l'enrichissement web ; architecture différente de toutes les autres sources).
      COÛT : `Crawl-delay: 5` dans le robots.txt du site (confirmé, aucun chemin
      interdit) — chaque offre coûte au moins 5 secondes de plus la marge de tentatives
      de reconnexion (le tunnel TLS se réinitialise occasionnellement, sans rapport avec
      l'état de l'offre — voir recuperer_employeur). Bornage obligatoire (`limit`,
      défaut 100) et filtre géographique par défaut (`province="Québec"`, ~10 000
      offres/mois sur ~52 000 nationalement) pour qu'un scan reste praticable — même
      principe que subventions_federales. Voir docs/STATUT_RESEAU.md pour le détail
      complet de la découverte et de la validation.

  - id: eimt
    nom: "Employeurs avec EIMT positive (EDSC)"
    signal_associe: [recrutement_massif]
    statut: actif
    blocage_type: null
    methode_acces: donnees_ouvertes
    champs_pertinents:
      - nom_employeur
      - lieu_affaires
      - profession_cnp
      - nombre_postes
      - volet_programme
      - trimestre
    cout: gratuit
    region: "Canada"
    connecteur: observador.sources.eimt
    regle_calibration: >
      Aucun filtrage de bruit nécessaire : chaque ligne du fichier est déjà une
      EIMT effectivement approuvée par Service Canada (pas une demande ou une
      intention) — signal fort par construction. Les limites inhérentes au jeu de
      données (exclusion des employeurs à nom personnel, ne couvre que le
      recours à des travailleurs étrangers temporaires) sont documentées mais ne
      sont pas des filtres que nous appliquons — elles viennent de la source
      elle-même. Score dédié (plus généreux qu'un simple affichage de poste) dans
      observador/scoring.py:_score_recrutement_massif (branche source_id=="eimt").
    notes: >
      PROMUE en source active Phase 1 le 2026-08-31 (mise à jour de spec, remplace
      Guichet-Emplois pour le signal recrutement). Testé avec de vraies données le
      2026-08-31 : téléchargement et parsing réels réussis (ex. "Barry Group Inc",
      Terre-Neuve-et-Labrador, 106 postes approuvés, profession "94142-Ouvriers...
      transformation du poisson"). DEUX découvertes techniques par rapport à la
      spec d'origine : (1) format réel = XLSX pour les trimestres récents (CSV
      seulement pour les plus anciens, ~2021 et avant) — le connecteur gère les
      deux ; (2) le fichier a une ligne de titre fusionnée avant la vraie ligne
      d'en-têtes, qui contient elle-même le mot "employeurs" — un piège pour un
      détecteur d'en-tête basé sur une simple sous-chaîne (corrigé en exigeant une
      correspondance EXACTE sur la cellule, pas une sous-chaîne — voir
      observador/sources/eimt.py:_find_header_row). Couvre tout le Canada ; en
      Phase 1, seules les entreprises résolvables via le REQ (Québec) produisent
      une notification, les autres restent `non_trouve` et sont exclues
      silencieusement — comportement attendu tant que Corporations Canada/autres
      registres provinciaux ne sont pas actifs (voir Généralisation du pivot
      d'identité, docs/ARCHITECTURE.md). BOGUE TROUVÉ ET CORRIGÉ le 2026-09-01 :
      un filtre par ligne comparait la date de DÉBUT du trimestre publié à une
      fenêtre glissante de 30-60 jours — vu le décalage de publication réel
      (~8 mois entre le trimestre le plus récent disponible et "aujourd'hui"),
      ça excluait TOUJOURS toutes les lignes, même les plus fraîches
      disponibles. Retiré (voir observador/sources/eimt.py) — le sélecteur de
      ressources (`cibles`) et le dédoublonnage par source_ref suffisent déjà.
      Validé : >200 signaux réels obtenus immédiatement après correction (voir
      docs/STATUT_RESEAU.md).

  - id: subventions_federales
    nom: "Subventions et contributions gouvernementales — divulgation proactive fédérale"
    signal_associe: [financement_expansion]
    statut: actif
    blocage_type: null
    methode_acces: api  # API Datastore CKAN — voir notes
    champs_pertinents:
      - nom_beneficiaire
      - montant
      - ministere_programme
      - date
      - description_projet
      - localisation_beneficiaire   # résolue via REQ si absente
    cout: gratuit
    region: "Canada"
    connecteur: observador.sources.subventions_federales
    regle_calibration: >
      Aucun filtrage de bruit nécessaire : chaque enregistrement est déjà une
      entente de subvention/contribution effectivement signée et divulguée
      (pas une demande), même logique que SEAO — voir seao.regle_calibration.
      Le type d'entente (agreement_type: G=subvention, C=contribution, O=autre)
      et le programme sont conservés pour affiner le scoring plus tard si besoin.
    notes: >
      ACTIVÉE en source Phase 1 le 2026-08-31 (demande d'Alexandre — les 4
      nouvelles sources de la mise à jour de spec sont activées directement,
      pas laissées à développer). Absorbe DEC, PARI-CNRC, CanExport, FedDev
      Ontario, FedNor, APECA, PrairiesCan, PacifiCan comme des filtres sur
      cette même source, pas des sources séparées. TESTÉ avec de vraies
      données le 2026-08-31 : le fichier CSV brut pèse ~2,3 Go (tout
      l'historique fédéral) — ingérable en entier ; utilise plutôt l'API
      Datastore CKAN (`datastore_search`, déjà indexée sur cette ressource),
      filtrée et triée par date. Exemple réel : "Le Festival International de
      Jazz de Montréal inc.", 249 999 $, Développement économique Canada pour
      les régions du Québec, 2026-07-28. Aucun nouveau domaine réseau requis
      (même infrastructure open.canada.ca/opencanada.blob.core.windows.net
      que le Guichet-Emplois et l'EIMT, déjà autorisée).

  - id: investissement_quebec
    nom: "Investissement Québec — divulgation publique"
    signal_associe: [financement_expansion]
    statut: actif
    blocage_type: null
    methode_acces: donnees_ouvertes
    champs_pertinents:
      - nom_entreprise
      - montant
      - date
      - programme_type_financement
      - adresse_region        # résolue via REQ si absente
      - secteur_activite       # résolu via REQ si absent
    cout: gratuit
    region: "Québec"
    connecteur: observador.sources.investissement_quebec
    regle_calibration: >
      Aucun filtrage de bruit nécessaire : chaque ligne de la liste de
      divulgation est déjà une intervention financière effectivement accordée
      (pas une demande) — même logique que SEAO. La distinction "expansion
      explicite vs formation/maintien" (spec section 6) demanderait de connaître
      le programme précis par ligne, non confirmé dans la structure réelle du
      PDF (non validé — voir notes) ; en son absence, le montant seul calibre le
      score (observador/scoring.py:_score_financement_expansion), ce qui reste
      cohérent avec le critère "montant relatif à la taille de l'entreprise".
    notes: >
      ACTIVÉE en source Phase 1 le 2026-08-31 (demande d'Alexandre). VALIDÉE
      avec de vraies données le 2026-08-31, une fois `www.investquebec.com`
      autorisé dans l'environnement — téléchargement et extraction de tableaux
      PDF réels réussis (pdfplumber). Exemples réels : "13548082 Canada Inc",
      3 000 000 $ ; "11888935 Canada Inc. (Workstaff)", 289 058 $. URL utilisée :
      investquebec.com/sites/default/files/2026-02/investissement-quebec-interventions-financieres-2025.pdf
      ("Liste de divulgation 2024-2025 — Nom de l'entreprise, Montant de
      financement"). La table ne contient que nom et montant (pas de date par
      ligne, pas de secteur/région — résolus via REQ comme prévu par la spec).
      Mise à jour annuelle : l'URL change chaque année (mois/année dans le
      chemin) — à ajuster à la main une fois par an (OBSERVADOR_IQ_PDF_URL ou
      paramètre `url` du connecteur), aucune découverte dynamique possible
      faute de portail structuré pour cette source.

  - id: deloitte_fast50
    nom: "Deloitte Technology Fast 50 (Canada/Québec)"
    signal_associe: [classement_croissance]
    statut: actif
    blocage_type: null
    methode_acces: scraping
    champs_pertinents: [nom_entreprise, taux_croissance, rang, categorie, annee_publication, region_ville]
    cout: gratuit
    region: "Québec/Canada"
    connecteur: observador.sources.deloitte_fast50
    regle_calibration: >
      Aucun filtrage de bruit nécessaire : chaque ligne du PDF officiel est déjà
      une entreprise classée par Deloitte selon un taux de croissance vérifié
      (méthodologie du programme) — signal fort par construction, pas une
      auto-déclaration. Le score existant (observador/scoring.py:
      _score_classement_croissance) combine déjà rang et taux de croissance.
    notes: >
      ACTIVÉE en source Phase 2 le 2026-09-01, validée avec de vraies données
      (82 entrées réelles du classement 2025, 13 au Québec — ex. Lightspeed,
      Hopper, nesto, Mistplay, Vention). Découverte réelle : la page
      d'atterrissage (fast50-winners.html) ne contient PAS le classement
      complet, seulement un résumé du #1 — le classement complet est dans un
      PDF téléchargeable dont le NOM DE FICHIER change chaque année, découvert
      dynamiquement (jamais codé en dur) via observador/sources/
      deloitte_fast50.py:trouver_url_pdf. Le PDF a 3 catégories distinctes
      (Technology Fast 50, Enterprise—Industry Leaders, Companies-to-Watch),
      dont le nombre de gagnants varie d'année en année (50/17/15 en 2025, pas
      toujours 50/50/50). Aucun champ secteur/site web/nombre d'employés dans
      ce PDF (contrairement à l'estimation initiale) — résolus via le REQ ou
      l'enrichissement web comme les autres sources qui ne les fournissent pas
      directement (spec section 7, "principe de complétude").

  - id: growth500
    nom: "Growth 500 (anciennement Croissance 500/PROFIT, Canadian Business)"
    signal_associe: [classement_croissance]
    statut: a_developper
    blocage_type: anti_bot
    methode_acces: scraping
    champs_pertinents: [nom_entreprise, secteur, taux_croissance, rang, annee_publication, region_ville, site_web, nombre_employes]
    cout: gratuit
    region: "Québec/Canada"
    connecteur: null
    notes: >
      INVESTIGUÉ le 2026-09-01, laissé de côté (décision à confirmer avec
      Alexandre) : canadianbusiness.com/www.canadianbusiness.com sont bien
      accessibles depuis cet environnement (domaines déjà autorisés), mais
      répondent par un vrai blocage anti-bot Cloudflare ("Attention Required!
      | Cloudflare", cookie __cf_bm de gestion de bots) — même mécanisme, même
      cause de fond (IP infonuagique/partagée de sortie) que le blocage REQ et
      les 4 moteurs de recherche testés pour l'enrichissement web, voir
      docs/STATUT_RESEAU.md. growth500.ca et l'URL d'archive
      (archiveprod.canadianbusiness.com) ne sont eux-mêmes pas atteignables
      (bloqués au niveau du proxy, domaines non autorisés). Distinct de ce
      blocage : les résultats de recherche (WebSearch) ne montrent aucune
      preuve d'un classement Growth 500 actuellement publié pour 2025/2026 —
      seulement une page d'archive et des mentions tierces (entreprises citant
      un classement passé) ; PROFIT 500/Growth 500 semble ne plus être
      activement republié depuis la restructuration de Canadian Business
      (contrairement à Deloitte Fast 50 et au Globe and Mail Top Growing
      Companies, tous deux confirmés actifs pour 2025). Aucun changement de
      code ni de liste réseau ne contournerait le blocage Cloudflare de toute
      façon (même conclusion que pour DuckDuckGo et consorts).

