      simple parsing de fichier structuré. Domaine réseau distinct de
      donneesquebec.ca/open.canada.ca — à ajouter à la liste Custom seulement à
      l'activation (ne pas ajouter par anticipation, voir docs/STATUT_RESEAU.md).
    notes: "Liste de divulgation publique gratuite, cible PME."

