      - adresse_region        # résolue via REQ si absente
      - secteur_activite       # résolu via REQ si absent
    cout: gratuit
    region: "Québec"
    connecteur: null
    notes: >
      Découverte (mise à jour de la spec, 2026-08-31) : la liste est publiée en
      PDF, pas en CSV/API structuré — hébergée sur www.investquebec.com (ex.
      investquebec.com/sites/default/files/.../interventions-financieres-2025.pdf),
