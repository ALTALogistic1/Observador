    connecteur: null
    notes: >
      Publié trimestriellement en CSV sur open.canada.ca. Signal de très haute qualité
      (pénurie de main-d'œuvre confirmée officiellement). Exclut les employeurs à nom
      personnel; ne couvre que les employeurs recourant à des travailleurs étrangers
      temporaires.

